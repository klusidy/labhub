# LabHub Properties Configuration
# This file defines property values for devices.
# Properties are applied after devices connect, using apply_properties_from_spec().

# Properties for dummy_01 device
dummy_01:
  foo: 0.42

# Properties for example_device_01
example_device_01:
  duration_in_seconds: 10
  time_step: 0.1
  number_of_time_steps: 500
  noise: true

# Example: Using fallback chain with "default" field
# If you have multiple similar devices, you can define common properties
# and override specific ones:
#
# laser_common:
#   power: 100
#   pulse_width: 5
#
# laser_exp1:
#   default: "laser_common"  # Inherit from laser_common
#   pulse_width: 10          # Override pulse_width
#
# laser_exp2:
#   default: "laser_common"  # Also inherits from laser_common
#   power: 120               # Override power

# Example: Using $READOUT to read current device value
# Use $READOUT to explicitly read the current value from the device
# instead of setting it:
#
# picoscope:
#   sampling_frequency: $READOUT  # Read current value from device
#   resolution: 14                # Set resolution to 14
